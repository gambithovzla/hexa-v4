name: MLB Release Smoke

on:
  schedule:
    - cron: "30 10 * * *"
  pull_request:
    paths:
      - "server/**"
      - "scripts/smoke/**"
      - "package.json"
      - ".github/workflows/mlb-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "scripts/smoke/**"
      - "package.json"
      - ".github/workflows/mlb-smoke.yml"
  workflow_dispatch:

concurrency:
  group: mlb-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  critical-tests:
    name: Run MLB critical unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run critical MLB tests
        run: npm run test:mlb:critical

  smoke:
    name: Run MLB smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: critical-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start API server
        env:
          PORT: "3001"
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Verify API process started
        run: |
          sleep 2
          if ! ps -p "$(cat server.pid)" > /dev/null; then
            echo "::error::API process exited before smoke checks"
            echo "----- server.log -----"
            cat server.log || true
            exit 1
          fi

      - name: Run MLB smoke script
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3001
          SMOKE_WAIT_FOR_SERVER: "1"
          SMOKE_TIMEOUT_MS: "15000"
          SMOKE_RETRIES: "3"
          SMOKE_RETRY_DELAY_MS: "1500"
          SMOKE_ADMIN_TOKEN: ${{ secrets.HEXA_ADMIN_SMOKE_TOKEN }}
        run: npm run smoke:mlb

      - name: Print server logs on failure
        if: failure()
        run: |
          echo "----- server.log -----"
          cat server.log

      - name: Stop API server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi

      - name: Upload smoke logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-smoke-server-log-${{ github.run_id }}
          path: server.log
          if-no-files-found: ignore
          retention-days: 7

