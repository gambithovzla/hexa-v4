[project]
name = "hexa-ml"
version = "0.1.0"
description = "H.E.X.A. v4 — Python ML sidecar (FastAPI + XGBoost) for MLB pick prediction"
requires-python = ">=3.11"
authors = [{ name = "H.E.X.A. Team" }]
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "xgboost>=1.7.6,<2.0.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "psycopg2-binary>=2.9.9",
    "SQLAlchemy>=2.0.30",
    "joblib>=1.4.0",
    "python-multipart>=0.0.10",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",  # FastAPI TestClient
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hexa_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]  # line-length handled by formatter
